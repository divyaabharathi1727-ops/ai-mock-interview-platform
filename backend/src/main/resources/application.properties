spring.application.name=mock-interview-backend

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/mock_interview_db
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET:local-development-secret-change-this-please-keep-long-enough}
jwt.expiration=${JWT_EXPIRATION:86400000}

interview.default-question-count=${INTERVIEW_DEFAULT_QUESTION_COUNT:20}
ai.api-key=${AI_API_KEY:}
ai.model=${AI_MODEL:gpt-4o-mini}
ai.api-url=${AI_API_URL:https://api.openai.com/v1/chat/completions}
ai.timeout-ms=${AI_TIMEOUT_MS:20000}
